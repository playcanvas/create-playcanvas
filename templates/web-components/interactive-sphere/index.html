<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/src/assets/playcanvas.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PlayCanvas + Web Components</title>
    </head>
    <body>
        <pc-app>
            <!-- Materials are declared once and referenced by id -->
            <pc-material id="sphere-material" diffuse="lightgrey"></pc-material>

            <pc-scene>
                <!-- Camera. Orbit controls are attached in src/main.ts -->
                <pc-entity name="camera" position="3.2 1.5 3.2" rotation="-10 45 0">
                    <pc-camera clear-color="#07101a"></pc-camera>
                </pc-entity>

                <!-- Lighting comes from the environment map, which is applied in src/main.ts -->

                <!-- Background grid. The grid script is attached in src/main.ts -->
                <pc-entity name="grid" scale="12 12 12"></pc-entity>

                <!-- The sphere. pc-app dispatches pointer events onto whatever the pointer hits -->
                <pc-entity name="sphere" position="0 0.7 0" scale="1.25 1.25 1.25">
                    <pc-render type="sphere" material="sphere-material"></pc-render>
                </pc-entity>
            </pc-scene>
        </pc-app>

        <p id="counter" class="counter">Click count: 0</p>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
