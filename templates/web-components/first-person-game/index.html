<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/src/assets/playcanvas.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>First-Person Game</title>
    </head>
    <body>
        <pc-app>
            <!-- Swap this for your own level - files in public/ are served next to index.html, so use a ./ path.
                 The game finds its nodes by name: a mesh called `level` to look at, one called
                 `collision` to stand on, any number called `orb-…` to collect, and one called `spawn`
                 where the player starts -->
            <pc-asset id="level" src="./level.glb"></pc-asset>

            <!-- Physics runs in Ammo, a WebAssembly module -->
            <pc-wasm name="Ammo" glue="./ammo/ammo.wasm.js" wasm="./ammo/ammo.wasm.wasm"></pc-wasm>

            <pc-scene>
                <!-- The sun is a directional light that the sky keeps pointing the way its own sun does.
                     Its shadows reach 45 m, far enough to cross the yard from any corner, split into
                     four cascades because one shadow map over that distance is too coarse up close -->
                <pc-entity name="sun">
                    <pc-light
                        type="directional"
                        intensity="2"
                        cast-shadows
                        shadow-distance="45"
                        num-cascades="4"
                        shadow-resolution="2048"
                        shadow-type="pcf5-32f"
                        shadow-bias="0.2"
                        normal-offset-bias="0.05"
                    ></pc-light>
                </pc-entity>

                <!-- The procedural sky is both the background and the ambient light. The script is
                     attached in src/main.ts -->
                <pc-entity name="sky"></pc-entity>

                <!-- The sky lights the shade blue. A warm light from the other side, with no shadows of
                     its own, stands in for the sunlight the ground bounces back, so the shade stays soft
                     and the sand warm -->
                <pc-entity name="fill" rotation="60 -30 0">
                    <pc-light type="directional" intensity="0.7" color="#ffdbb3"></pc-light>
                </pc-entity>

                <!-- The player is a capsule the physics moves, with the camera at eye height. The game
                     places it at the level's spawn point and gives it a first-person controller -->
                <pc-entity name="player">
                    <pc-collision type="capsule" radius="0.45" height="1.8"></pc-collision>
                    <pc-rigid-body type="dynamic" mass="80" angular-factor="0 0 0"></pc-rigid-body>
                    <!-- The sky is HDR, so the camera needs tone mapping to bring it back into
                         displayable range -->
                    <pc-entity name="camera" position="0 0.65 0">
                        <pc-camera fov="80" tonemap="aces2"></pc-camera>
                    </pc-entity>
                </pc-entity>

                <!-- The game is attached in src/main.ts -->
                <pc-entity name="game"></pc-entity>
            </pc-scene>
        </pc-app>
        <div class="hud">
            <header class="status">
                <span id="orbs"></span>
                <span id="time"></span>
            </header>
            <section class="panel card" id="card">
                <h1 id="card-title"></h1>
                <p id="card-hint"></p>
            </section>
            <div class="crosshair"></div>
            <div class="joystick" id="joystick" hidden></div>
            <div class="joystick-knob" id="joystick-knob" hidden></div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
