<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/src/assets/playcanvas.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Physics Playground</title>
    </head>
    <body>
        <pc-app>
            <pc-scene>
                <pc-entity name="camera" position="8 6 8"><pc-camera clear-color="#0d121c"></pc-camera></pc-entity>
                <pc-entity name="light" rotation="45 35 0"
                    ><pc-light type="directional" intensity="2" cast-shadows></pc-light
                ></pc-entity>
                <pc-entity name="floor" position="0 -0.1 0" scale="10 0.2 10"
                    ><pc-render type="box"></pc-render><pc-collision type="box"></pc-collision
                    ><pc-rigidbody type="static"></pc-rigidbody
                ></pc-entity>
                <pc-entity id="bodies"></pc-entity>
            </pc-scene>
        </pc-app>
        <div class="hud">
            <section class="panel">
                <h1>Physics Playground</h1>
                <p>Rigid bodies, collisions and runtime spawning.</p>
                <div class="controls"><button id="spawn">Spawn object</button><button id="reset">Reset</button></div>
            </section>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
