<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Dodge</title>
    </head>
    <body>
        <main class="lens">
            <canvas id="application-canvas"></canvas>
            <div class="lens-hud">
                <header class="lens-bar">
                    <img class="lens-avatar" alt="Your Bitmoji" hidden />
                    <span class="lens-score">0</span>
                    <span class="lens-best">Best 0</span>
                </header>
                <section class="lens-card">
                    <h1 class="lens-title">Dodge</h1>
                    <button class="lens-leaderboard" hidden>Leaderboard</button>
                    <p class="lens-hint">Drag to steer. Tap to play</p>
                </section>
            </div>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
