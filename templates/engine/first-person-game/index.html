<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/src/assets/playcanvas.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>First-Person Game</title>
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <div class="hud">
            <header class="status">
                <span id="orbs"></span>
                <span id="time"></span>
            </header>
            <section class="panel card" id="card">
                <h1 id="card-title"></h1>
                <p id="card-hint"></p>
            </section>
            <div class="crosshair"></div>
            <div class="joystick" id="joystick" hidden></div>
            <div class="joystick-knob" id="joystick-knob" hidden></div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
