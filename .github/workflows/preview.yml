name: Preview

# Builds every starter in every format and publishes them to GitHub Pages, so anyone can try what
# the CLI scaffolds, on a phone too, without running it. It follows each release, so the site shows
# what `npm create playcanvas@latest` gives. It runs on the default branch, not the release's tag,
# because the github-pages environment only takes deployments from there.
on:
    workflow_run:
        workflows: [Publish]
        types: [completed]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: true

env:
    # the released commit after a release, and the default branch when run by hand
    SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
    catalog:
        name: Catalog
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        outputs:
            formats: ${{ steps.catalog.outputs.formats }}
            starters: ${{ steps.catalog.outputs.starters }}
        steps:
            - name: Check out code
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.SOURCE }}

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: List formats and starters
              id: catalog
              run: |
                  node --input-type=module -e "
                      import { FORMATS, STARTERS } from './templates/index.ts';
                      console.log('formats=' + JSON.stringify(FORMATS.map((f) => f.name)));
                      console.log('starters=' + JSON.stringify(STARTERS.map((s) => s.name)));
                  " >> "$GITHUB_OUTPUT"

    builds:
        name: Build (${{ matrix.format }} / ${{ matrix.starter }})
        needs: catalog
        runs-on: ubuntu-latest
        strategy:
            matrix:
                format: ${{ fromJSON(needs.catalog.outputs.formats) }}
                starter: ${{ fromJSON(needs.catalog.outputs.starters) }}
        steps:
            - name: Check out code
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.SOURCE }}

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install dependencies
              run: npm ci

            - name: Build CLI
              run: npm run build

            - name: Scaffold starter
              run: |
                  node dist/index.mjs "$RUNNER_TEMP/project" \
                    --format "${{ matrix.format }}" \
                    --starter "${{ matrix.starter }}" \
                    --no-skills

            - name: Install template dependencies
              working-directory: ${{ runner.temp }}/project
              run: npm install

            - name: Build template
              working-directory: ${{ runner.temp }}/project
              run: npm run build

            - name: Upload build
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.format }}-${{ matrix.starter }}
                  path: ${{ runner.temp }}/project/${{ matrix.starter == 'web-lens' && 'dist/lens' || 'dist' }}
                  if-no-files-found: error
                  retention-days: 1

    deploy:
        name: Deploy
        needs: builds
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Check out code
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.SOURCE }}

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            # each build lands in a folder named after its artifact, <format>-<starter>
            - name: Download builds
              uses: actions/download-artifact@v8
              with:
                  path: ${{ runner.temp }}/builds

            - name: Assemble site
              run: node .github/scripts/build-preview-site.mjs "$RUNNER_TEMP/builds" "$RUNNER_TEMP/site"

            - name: Upload site
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ${{ runner.temp }}/site

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
