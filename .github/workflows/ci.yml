name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Run Prettier
              run: npm run fmt

            - name: Run ESLint
              run: npm run lint

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

    non-interactive:
        name: Non-interactive runs
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Build CLI
              run: npm run build

            # stdin is closed and stdout goes to the log, as when an AI agent or a script runs the
            # command, so nothing can answer a prompt
            - name: Take the defaults
              working-directory: ${{ runner.temp }}
              run: |
                  node "$GITHUB_WORKSPACE/dist/index.mjs" < /dev/null
                  test -f playcanvas-project/src/main.ts
                  node "$GITHUB_WORKSPACE/dist/index.mjs" lens --starter web-lens < /dev/null
                  test -f lens/src/main.ts
                  test -f lens/scripts/package-lens.mjs
                  node "$GITHUB_WORKSPACE/dist/index.mjs" react-app --format react < /dev/null
                  test -f react-app/src/App.tsx

            - name: Keep the files already in the target directory
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir -p brief && echo '# Mine' > brief/README.md && echo 'A game.' > brief/spec.md
                  node "$GITHUB_WORKSPACE/dist/index.mjs" brief --keep < /dev/null
                  grep -qx '# Mine' brief/README.md
                  test -f brief/spec.md
                  test -f brief/package.json
                  test -f brief/src/main.ts
                  if node "$GITHUB_WORKSPACE/dist/index.mjs" brief --keep < /dev/null; then
                      echo "::error::--keep in a directory with a package.json should fail"
                      exit 1
                  fi

            - name: List the formats and starters in the help
              run: |
                  node dist/index.mjs --help > help.txt
                  node --input-type=module -e "
                      import fs from 'node:fs';
                      import { FORMATS, STARTERS } from './templates/index.ts';
                      const help = fs.readFileSync('help.txt', 'utf8');
                      const missing = [...FORMATS, ...STARTERS].filter((item) => !help.includes('  ' + item.name + ' '));
                      if (missing.length) throw new Error('not in --help: ' + missing.map((item) => item.name).join(', '));
                  "

            - name: Fail where no default is safe
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir -p taken && touch taken/keep
                  if node "$GITHUB_WORKSPACE/dist/index.mjs" taken < /dev/null; then
                      echo "::error::a non-empty target directory without --keep or --overwrite should fail"
                      exit 1
                  fi
                  test -f taken/keep
                  if node "$GITHUB_WORKSPACE/dist/index.mjs" taken --keep --overwrite < /dev/null; then
                      echo "::error::--keep with --overwrite should fail"
                      exit 1
                  fi
                  test -f taken/keep
                  if node "$GITHUB_WORKSPACE/dist/index.mjs" bad-format --format nope < /dev/null; then
                      echo "::error::an unknown format should fail"
                      exit 1
                  fi
                  if node "$GITHUB_WORKSPACE/dist/index.mjs" bad-starter --starter nope < /dev/null; then
                      echo "::error::an unknown starter should fail"
                      exit 1
                  fi

    test:
        name: Test
        runs-on: ubuntu-latest
        outputs:
            formats: ${{ steps.catalog.outputs.formats }}
            starters: ${{ steps.catalog.outputs.starters }}
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            # the tests check that every starter exists in every format, so the matrix below can take
            # its formats and starters straight from the catalog
            - name: List formats and starters
              id: catalog
              run: |
                  node --input-type=module -e "
                      import { FORMATS, STARTERS } from './templates/index.ts';
                      console.log('formats=' + JSON.stringify(FORMATS.map((f) => f.name)));
                      console.log('starters=' + JSON.stringify(STARTERS.map((s) => s.name)));
                  " >> "$GITHUB_OUTPUT"

    templates:
        name: Starter (${{ matrix.format }} / ${{ matrix.starter }})
        needs: test
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                format: ${{ fromJSON(needs.test.outputs.formats) }}
                starter: ${{ fromJSON(needs.test.outputs.starters) }}
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install dependencies
              run: npm ci

            - name: Build CLI
              run: npm run build

            - name: Scaffold starter
              run: |
                  node dist/index.mjs "$RUNNER_TEMP/${{ matrix.format }}-${{ matrix.starter }}" \
                    --format "${{ matrix.format }}" \
                    --starter "${{ matrix.starter }}"

            - name: Assert skills and agent instructions present
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: |
                  test -d .claude/skills/build-app
                  test -d .agents/skills/build-app
                  grep -q '^## Checking your work' AGENTS.md
                  grep -qx '@AGENTS.md' CLAUDE.md

            - name: Check legacy flags and --no-skills
              if: matrix.format == 'engine' && matrix.starter == 'spinning-cube'
              run: |
                  node dist/index.mjs "$RUNNER_TEMP/legacy-no-skills" \
                    --template engine \
                    --boilerplate spinning-cube \
                    --no-skills
                  test ! -d "$RUNNER_TEMP/legacy-no-skills/.claude"
                  test ! -d "$RUNNER_TEMP/legacy-no-skills/.agents"

            - name: Install template dependencies
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm install

            - name: Check template formatting
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run fmt

            - name: Lint template
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run lint

            - name: Typecheck template
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run typecheck

            - name: Build template
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run build

            - name: Check build paths are relative
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: node "$GITHUB_WORKSPACE/.github/scripts/check-relative-urls.mjs" ${{ matrix.starter == 'web-lens' && 'dist/lens' || 'dist' }}

            - name: Package Web Lens
              if: matrix.starter == 'web-lens'
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: |
                  npm run package
                  unzip -l "dist/${{ matrix.format }}-web-lens-v0.0.0.zip" | grep -q ' index.html$'
