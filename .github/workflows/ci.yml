name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Run Prettier
              run: npm run fmt

            - name: Run ESLint
              run: npm run lint

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

    templates:
        name: Starter (${{ matrix.format }} / ${{ matrix.starter }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                format: [engine, react, web-components]
                starter:
                    - spinning-cube
                    - interactive-sphere
                    - model-viewer
                    - splat-viewer
                    - product-configurator
                    - physics-playground
                    - first-person-controller
                    - third-person-controller
                    - sprite-game
                    - scene-editor
                    - vr-starter
                    - ar-placement
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install dependencies
              run: npm ci

            - name: Build CLI
              run: npm run build

            - name: Scaffold starter
              run: |
                  node dist/index.mjs "$RUNNER_TEMP/${{ matrix.format }}-${{ matrix.starter }}" \
                    --format "${{ matrix.format }}" \
                    --starter "${{ matrix.starter }}"

            - name: Assert skills present
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: |
                  test -d .claude/skills/build-app
                  test -d .agents/skills/build-app

            - name: Check legacy flags and --no-skills
              if: matrix.format == 'engine' && matrix.starter == 'spinning-cube'
              run: |
                  node dist/index.mjs "$RUNNER_TEMP/legacy-no-skills" \
                    --template engine \
                    --boilerplate spinning-cube \
                    --no-skills
                  test ! -d "$RUNNER_TEMP/legacy-no-skills/.claude"
                  test ! -d "$RUNNER_TEMP/legacy-no-skills/.agents"

            - name: Install template dependencies
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm install

            - name: Check template formatting
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run fmt

            - name: Lint template
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run lint

            - name: Typecheck template
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run typecheck

            - name: Build template
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run build
