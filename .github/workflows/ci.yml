name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.19.0
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.19.0
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Run Prettier
              run: npm run fmt

            - name: Run ESLint
              run: npm run lint

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.19.0
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

    templates:
        name: Template (${{ matrix.template }} / ${{ matrix.boilerplate }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                template: [engine, react, web-components]
                boilerplate: [spinning-cube, interactive-sphere]
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.19.0
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install dependencies
              run: npm ci

            - name: Build CLI
              run: npm run build

            - name: Scaffold template
              run: |
                  node dist/index.mjs "$RUNNER_TEMP/${{ matrix.template }}-${{ matrix.boilerplate }}" \
                    --template "${{ matrix.template }}" \
                    --boilerplate "${{ matrix.boilerplate }}"

            - name: Assert skills present
              working-directory: ${{ runner.temp }}/${{ matrix.template }}-${{ matrix.boilerplate }}
              run: |
                  test -d .claude/skills/build-app
                  test -d .agents/skills/build-app

            - name: Assert --no-skills omits skills
              run: |
                  node dist/index.mjs "$RUNNER_TEMP/no-skills-${{ matrix.template }}-${{ matrix.boilerplate }}" \
                    --template "${{ matrix.template }}" \
                    --boilerplate "${{ matrix.boilerplate }}" \
                    --no-skills
                  test ! -d "$RUNNER_TEMP/no-skills-${{ matrix.template }}-${{ matrix.boilerplate }}/.claude"
                  test ! -d "$RUNNER_TEMP/no-skills-${{ matrix.template }}-${{ matrix.boilerplate }}/.agents"

            - name: Install template dependencies
              working-directory: ${{ runner.temp }}/${{ matrix.template }}-${{ matrix.boilerplate }}
              run: npm install

            - name: Check template formatting
              working-directory: ${{ runner.temp }}/${{ matrix.template }}-${{ matrix.boilerplate }}
              run: npm run fmt

            - name: Lint template
              working-directory: ${{ runner.temp }}/${{ matrix.template }}-${{ matrix.boilerplate }}
              run: npm run lint

            - name: Typecheck template
              working-directory: ${{ runner.temp }}/${{ matrix.template }}-${{ matrix.boilerplate }}
              run: npm run typecheck

            - name: Build template
              working-directory: ${{ runner.temp }}/${{ matrix.template }}-${{ matrix.boilerplate }}
              run: npm run build
