name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Run Prettier
              run: npm run fmt

            - name: Run ESLint
              run: npm run lint

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

    non-interactive:
        name: Non-interactive runs
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Build CLI
              run: npm run build

            # stdin is closed and stdout goes to the log, as when an AI agent or a script runs the
            # command, so nothing can answer a prompt
            - name: Take the defaults
              working-directory: ${{ runner.temp }}
              run: |
                  node "$GITHUB_WORKSPACE/dist/index.mjs" < /dev/null
                  test -f playcanvas-project/src/main.ts
                  node "$GITHUB_WORKSPACE/dist/index.mjs" lens --starter web-lens < /dev/null
                  test -f lens/src/main.ts
                  test -f lens/scripts/package-lens.mjs
                  node "$GITHUB_WORKSPACE/dist/index.mjs" react-app --format react < /dev/null
                  test -f react-app/src/App.tsx

            - name: Fail where no default is safe
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir -p taken && touch taken/keep
                  if node "$GITHUB_WORKSPACE/dist/index.mjs" taken < /dev/null; then
                      echo "::error::a non-empty target directory without --overwrite should fail"
                      exit 1
                  fi
                  test -f taken/keep
                  if node "$GITHUB_WORKSPACE/dist/index.mjs" bad-format --format nope < /dev/null; then
                      echo "::error::an unknown format should fail"
                      exit 1
                  fi
                  if node "$GITHUB_WORKSPACE/dist/index.mjs" bad-starter --starter nope < /dev/null; then
                      echo "::error::an unknown starter should fail"
                      exit 1
                  fi

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install Dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    templates:
        name: Starter (${{ matrix.format }} / ${{ matrix.starter }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                format: [engine, react, web-components]
                starter:
                    - spinning-cube
                    - interactive-sphere
                    - model-viewer
                    - splat-viewer
                    - product-configurator
                    - physics-playground
                    - first-person-controller
                    - third-person-controller
                    - sprite-game
                    - web-lens
                    - scene-editor
                    - vr-starter
                    - ar-placement
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.23.2
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org/'

            - name: Install dependencies
              run: npm ci

            - name: Build CLI
              run: npm run build

            - name: Scaffold starter
              run: |
                  node dist/index.mjs "$RUNNER_TEMP/${{ matrix.format }}-${{ matrix.starter }}" \
                    --format "${{ matrix.format }}" \
                    --starter "${{ matrix.starter }}"

            - name: Assert skills present
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: |
                  test -d .claude/skills/build-app
                  test -d .agents/skills/build-app

            - name: Check legacy flags and --no-skills
              if: matrix.format == 'engine' && matrix.starter == 'spinning-cube'
              run: |
                  node dist/index.mjs "$RUNNER_TEMP/legacy-no-skills" \
                    --template engine \
                    --boilerplate spinning-cube \
                    --no-skills
                  test ! -d "$RUNNER_TEMP/legacy-no-skills/.claude"
                  test ! -d "$RUNNER_TEMP/legacy-no-skills/.agents"

            - name: Install template dependencies
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm install

            - name: Check template formatting
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run fmt

            - name: Lint template
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run lint

            - name: Typecheck template
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run typecheck

            - name: Build template
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: npm run build

            - name: Package Web Lens
              if: matrix.starter == 'web-lens'
              working-directory: ${{ runner.temp }}/${{ matrix.format }}-${{ matrix.starter }}
              run: |
                  npm run package
                  unzip -l "dist/${{ matrix.format }}-web-lens.zip" | grep -q ' index.html$'
